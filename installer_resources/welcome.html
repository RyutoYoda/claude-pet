<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: -apple-system, sans-serif; font-size: 11pt; margin: 30px;">
<h2>Claude Pet へようこそ</h2>
<p>
Claude Code の実行状態を可視化する macOS デスクトップペットです。
</p>
<p>
インストール後、<code>/Applications/Claude Pet.app</code> を開くだけで使えます。
</p>
<p style="background: #fff8e1; border-left: 4px solid #f5a623; padding: 10px; border-radius: 4px;">
<strong>注意:</strong> 署名なし配布のため、このインストーラーを開く際に
「開発元を確認できない」と表示される場合があります。<br>
その場合は <strong>右クリック → 開く</strong> するか、
<strong>システム設定 → プライバシーとセキュリティ → このまま開く</strong> を選択してください。
</p>
</body>
</html>
